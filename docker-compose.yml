services:
  postgres:
    image: postgres:16-alpine
    container_name: app_calculos_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: app_calculos
      POSTGRES_PASSWORD: app_calculos
      POSTGRES_DB: app_calculos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_calculos -d app_calculos']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
